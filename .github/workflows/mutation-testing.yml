name: Mutation Testing (PIT)

# Se ejecuta a mano desde la pestana Actions (Run workflow).
# El disparador de pull_request solo corre cuando cambia este archivo, para validar la configuracion.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/mutation-testing.yml'

jobs:
  pitest:
    name: PIT (modulo reservas)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: 'zulu'

      - name: Run PIT
        run: |
          chmod +x gradlew
          ./gradlew pitest

      - name: Upload PIT report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pit-report
          path: build/reports/pitest/
