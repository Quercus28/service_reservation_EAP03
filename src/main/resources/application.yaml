spring:
  application:
    name: EAP03
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:eap03}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db,classpath:db/migration
    outOfOrder: true
    cleanDisabled: true
    repair-on-migrate: true
  web:
    error:
      # Nunca devolver la traza, el mensaje interno ni la clase de la excepción,
      # aunque devtools esté activo.
      include-stacktrace: never
      include-message: never
      include-exception: false

logging:
  pattern:
    # Cada línea de log lleva el traceId de la petición (lo pone TraceIdFilter).
    level: "%5p [traceId=%X{traceId:-}]"

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration-in-seconds: ${JWT_EXPIRATION:3600}

swagger:
  security:
    enabled: ${SWAGGER_SECURITY_ENABLED:false}
    username: ${SWAGGER_USERNAME:}
    password: ${SWAGGER_PASSWORD:}

# Reservas
reservas:
  cancelacion:
    # Cuántas horas antes del inicio se puede cancelar como máximo.
    anticipacion-minima-horas: 2
