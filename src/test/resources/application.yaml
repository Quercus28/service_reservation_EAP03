spring:
  application:
    name: EAP03
  datasource:
    url: jdbc:h2:mem:eap03-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db,classpath:db/migration
    baseline-on-migrate: true
    repair-on-migrate: true
  h2:
    console:
      enabled: true
      path: /h2-console
